<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Pocket Arcade — five zero-asset retro-neon arcade games with procedural graphics, synthesized audio, and deterministic game logic."
    />
    <meta name="theme-color" content="#071114" />
    <title>Pocket Arcade</title>
    <script>
      // Resolve the theme before first paint (no flash): a stored choice
      // wins, otherwise the system preference; dark is the arcade default.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('pocket-arcade:theme');
        } catch (error) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
